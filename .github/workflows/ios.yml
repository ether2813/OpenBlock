name: iOS build

on:
  push:
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"
    tags:
      - "v*"
  pull_request:
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ipa:
    name: Build unsigned IPA
    runs-on: macos-15
    timeout-minutes: 45
    defaults:
      run:
        working-directory: ios

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Install XcodeGen and ldid
        run: brew install xcodegen ldid

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build for iOS devices (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project OpenBlock.xcodeproj \
            -scheme OpenBlock \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath build \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee xcodebuild.log | grep -E "error:|warning: .*deprecated|\*\* BUILD" || true
          grep -q "\*\* BUILD SUCCEEDED \*\*" xcodebuild.log

      - name: Show build errors
        if: failure()
        run: grep -n -B2 -A6 "error:" xcodebuild.log | head -n 300 || true

      - name: Package IPA
        run: |
          set -euo pipefail
          APP="build/Build/Products/Release-iphoneos/OpenBlock.app"
          test -d "$APP"

          # Ad-hoc sign every binary with its entitlements so sideloading tools
          # (Sideloadly, AltStore, …) know which capabilities to request when they re-sign.
          sign() {
            local bundle="$1" entitlements="$2"
            local executable
            executable=$(/usr/libexec/PlistBuddy -c "Print :CFBundleExecutable" "$bundle/Info.plist")
            ldid -S"$entitlements" "$bundle/$executable"
          }
          sign "$APP/PlugIns/OpenBlockMonitor.appex" Extensions/Monitor/Monitor.entitlements
          sign "$APP/PlugIns/OpenBlockShieldConfiguration.appex" Extensions/ShieldConfiguration/ShieldConfiguration.entitlements
          sign "$APP/PlugIns/OpenBlockShieldAction.appex" Extensions/ShieldAction/ShieldAction.entitlements
          sign "$APP/PlugIns/OpenBlockReport.appex" Extensions/Report/Report.entitlements
          sign "$APP" App/OpenBlock.entitlements

          rm -rf Payload OpenBlock.ipa
          mkdir Payload
          cp -R "$APP" Payload/
          zip -qry OpenBlock.ipa Payload
          ls -lh OpenBlock.ipa
          echo "### OpenBlock.ipa built ($(du -h OpenBlock.ipa | cut -f1))" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: OpenBlock-ipa
          path: ios/OpenBlock.ipa
          if-no-files-found: error

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: ios/xcodebuild.log
          if-no-files-found: ignore

  release:
    name: Attach IPA to release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-ipa
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: OpenBlock-ipa
      - uses: softprops/action-gh-release@v2
        with:
          files: OpenBlock.ipa
          generate_release_notes: true
